name: Deploy support-bot

on:
push:
branches:
- main

permissions:
contents: read

jobs:
deploy:
runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Deploy Worker
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    run: |
      curl --fail-with-body --silent --show-error \
        -X PUT \
        "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/support-bot/content" \
        -H "Authorization: Bearer ${CF_TOKEN}" \
        -F 'metadata={"main_module":"worker.js"};type=application/json' \
        -F 'worker.js=@worker.js;type=application/javascript+module'
